name: Publish explicitly requested recovery test APK
on:
  push:
    branches: ['arena/7a55276c-eternalz-forge']
    paths: ['.github/workflows/publish-recovery-test-apk.yml']
permissions:
  actions: read
  contents: write
jobs:
  publish-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Validate tested source and publish direct APK prerelease
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/publish.log") 2>&1
          # Fixed successful run, not user-supplied artifacts or an untested rebuild.
          run=45051287394
          sha=87f7e20162714fef50e067065f0be82092d8c9d1
          gh api "repos/$GH_REPO/actions/runs/$run" > "$RUNNER_TEMP/run.json"
          python3 - "$RUNNER_TEMP/run.json" "$sha" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          assert data['conclusion']=='success'
          assert data['head_sha']==sys.argv[2]
          assert data['head_branch']=='arena/3f610dc4-eternalz-forge'
          assert data['event']=='push'
          PY
          gh run download "$run" -n eternalz-forge-debug -D "$RUNNER_TEMP/apk"
          apk="$RUNNER_TEMP/apk/eternalz-forge-0.3.4-test.apk"
          mv "$RUNNER_TEMP/apk/app-debug.apk" "$apk"
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$signer" verify --verbose --print-certs "$apk"
          (cd "$RUNNER_TEMP/apk" && sha256sum eternalz-forge-0.3.4-test.apk > eternalz-forge-0.3.4-test.apk.sha256)
          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          TEST BUILD — direct APK with merged session-recovery fixes and clearer authentication errors.

          This is the exact APK from successful run 45051287394: lint, JVM tests and thirteen emulator tests passed. Live GitHub account approval still needs user testing. Repository deletion requires opt-in delete_repo permission and administrator rights; no real repositories were deleted during tests.

          IMPORTANT: this build uses a disposable debug signing certificate, NOT the future permanent distribution key. It is not promised to update an older installation or accept future permanently signed updates. Android may reject installation over an existing build. Do not uninstall or clear storage without saving local drafts. If incompatible, waiting for the permanently signed release avoids another migration.

          Download the .apk asset directly; no ZIP extraction required. This prerelease intentionally has no stable update metadata and is excluded from in-app stable updates. No private signing key is published or embedded in repository files.
          NOTES
          # Do not overwrite existing releases or assets.
          # Draft metadata was created through the repository connection after the
          # runner token was denied permission to create a release. Upload only;
          # the draft will be published separately after checking both assets.
          gh release upload v0.3.4-test "$apk" "$apk.sha256"
      - name: Bounded publication diagnostics
        if: failure()
        run: |
          python3 - <<'PY'
          import os,pathlib
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'publish.log'
          text=path.read_text(errors='replace')[-3500:] if path.exists() else 'No publication log.'
          text=text.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print('::error title=APK publication diagnostic::'+text)
          PY
