name: Android verification
on:
  push:
    paths: ['app/**', 'gradle/**', '*.gradle.kts', 'gradle.properties', 'gradlew*', '.github/workflows/android.yml', 'tools/android/device-test.sh']
  pull_request:
    paths: ['app/**', 'gradle/**', '*.gradle.kts', 'gradle.properties', 'gradlew*', '.github/workflows/android.yml', 'tools/android/device-test.sh']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    env:
      GITHUB_OAUTH_CLIENT_ID: ${{ vars.GITHUB_OAUTH_CLIENT_ID }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Restore permanent distribution signing identity
        env:
          SIGNING_JSON: ${{ secrets.FORGE_ANDROID_SIGNING }}
        run: |
          python3 - <<'PYKEY'
          import base64,json,os,pathlib
          raw=os.environ.get('SIGNING_JSON', '')
          if not raw:
              print('::warning::No permanent signing identity. This build is test-only and will NOT be published as an install/update APK.')
          else:
              data=json.loads(raw)
              password=data['password']
              if not password or '\n' in password or '\r' in password: raise ValueError('Invalid signing password')
              print('::add-mask::'+password)
              path=pathlib.Path(os.environ['RUNNER_TEMP'])/'forge-signing.p12'
              path.write_bytes(base64.b64decode(data['keystore'],validate=True))
              path.chmod(0o600)
              with open(os.environ['GITHUB_ENV'],'a') as env:
                  env.write(f'FORGE_SIGNING_STORE={path}\nFORGE_SIGNING_PASSWORD={password}\n')
          PYKEY
      - name: Lint, unit tests, debug APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon verifyGitHubSignInConfiguration lintDebug testDebugUnitTest assembleDebug 2>&1 | tee "$RUNNER_TEMP/android-build.log"
      - name: Publish bounded failure diagnostics
        if: failure()
        run: |
          python3 - <<'PYLOG'
          import os
          from pathlib import Path
          log = Path(os.environ['RUNNER_TEMP']) / 'android-build.log'
          text = log.read_text(errors='replace')[-3500:] if log.exists() else 'No Gradle log was produced.'
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Android build diagnostic::' + text)
          PYLOG
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success()
        with:
          name: eternalz-forge-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  publish-apk:
    needs: [verify, device-design]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/arena/3f610dc4-eternalz-forge'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Publish only permanently signed tested APKs
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_JSON: ${{ secrets.FORGE_ANDROID_SIGNING }}
        run: |
          if [ -z "$SIGNING_JSON" ]; then
            echo '::warning::Direct APK publication blocked: configure FORGE_ANDROID_SIGNING once. Refusing to distribute another incompatible disposable-key APK.'
            exit 0
          fi
          gh run download "$GITHUB_RUN_ID" -n eternalz-forge-debug -D "$RUNNER_TEMP/apk"
          version=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          code=$(sed -n 's/.*versionCode = \([0-9]*\)/\1/p' app/build.gradle.kts)
          apk="$RUNNER_TEMP/apk/eternalz-forge-v$version.apk"
          mv "$RUNNER_TEMP/apk/app-debug.apk" "$apk"
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$signer" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/signature.txt"
          cert=$(sed -n 's/Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/signature.txt")
          test "${#cert}" = 64
          sha256sum "$apk" > "$apk.sha256"
          cat > "$RUNNER_TEMP/release-notes" <<EOFNOTES
          Native Android development build; install the APK directly, no ZIP extraction.
          GitHub sign-in now saves pending grants encrypted and resumes after browser return/process recreation.
          Updates use a permanent signing identity. Older disposable-debug-key installs cannot be migrated without their original key; save drafts before any uninstall.
          This is not a production security audit or proof of live account approval.

          Forge-Version-Code: $code
          Forge-Signing-SHA256: $cert
          EOFNOTES
          # Never replace an existing release's APK/signature/version silently.
          gh release create "v$version" "$apk" "$apk.sha256" --target "$GITHUB_SHA" --title "Eternalz Forge $version" --notes-file "$RUNNER_TEMP/release-notes"

  device-design:
    env:
      GITHUB_OAUTH_CLIENT_ID: ${{ vars.GITHUB_OAUTH_CLIENT_ID }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Allow hardware acceleration on this disposable runner
        run: sudo chmod a+rw /dev/kvm
      - name: Native UI, Keystore and theme regression tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0, reviewed, Apache-2.0
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          ram-size: 2048M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash tools/android/device-test.sh
      - name: Publish test diagnostics and test-fixture visual previews
        if: always()
        run: |
          python3 - <<'PYDEVICE'
          import base64, os
          from pathlib import Path
          reports = list(Path('app/build/outputs/androidTest-results').rglob('TEST-*.xml'))
          failures = []
          cases = []
          import xml.etree.ElementTree as ET
          for report in reports:
              root = ET.parse(report).getroot()
              for case in root.iter('testcase'):
                  cases.append(case.attrib.get('classname','') + '.' + case.attrib.get('name',''))
                  for failure in list(case.findall('failure')) + list(case.findall('error')):
                      failures.append(case.attrib.get('name','test') + ': ' + (failure.text or failure.attrib.get('message','')))
          if cases:
              print('::notice title=Device test summary::' + str(len(cases)) + ' test cases: ' + ', '.join(cases))
          if failures:
              text = '\n'.join(failures)[-3500:]
              print('::error title=Device test failures::' + text.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          elif not reports:
              log = Path(os.environ['RUNNER_TEMP']) / 'device-tests.log'
              text = log.read_text(errors='replace')[-3500:] if log.exists() else 'No device test report was produced.'
              print('::warning title=Device test diagnostics::' + text.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PYDEVICE
      - name: Preview sign-in fixture
        if: always()
        run: python3 tools/android/publish-design-preview.py sign-in-light
      - name: Preview workspace light fixture
        if: always()
        run: python3 tools/android/publish-design-preview.py workspace-light
      - name: Preview workspace dark fixture
        if: always()
        run: python3 tools/android/publish-design-preview.py workspace-dark
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-design-and-device-tests
          path: |
            design-screenshots/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 7
